name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-validation:
    name: PR Validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce single commit per PR
        run: |
          COMMIT_COUNT=$(git rev-list --count origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }})
          echo "PR contains $COMMIT_COUNT commit(s)"
          if [ "$COMMIT_COUNT" -ne 1 ]; then
            echo "::error::PR must contain exactly 1 commit (found $COMMIT_COUNT). Squash your commits before merging."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Run ESLint (root flat config)
        run: npx eslint . --max-warnings=0

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm install --workspaces --include-workspace-root

      - name: TypeScript --noEmit
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Build apps/debug-web
        run: npm run build
